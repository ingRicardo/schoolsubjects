<h1>Multiplications</h1>
<!-- Declaring a shared action inside the template using @let -->
@let fallbackAction = { actionType: 'generic-click' };

<div class="button-container">
  @for (btn of buttons; track btn.id) {
    <!-- Merging fallback object properties with your array items -->
    <button   (click)="handleButtonClick(( { ...fallbackAction, ...btn } ).actionType)">
      {{ btn.label }}
    </button>
  }
</div>


    <div class="table-container">
      <h2>Multiplication Table for {{ tableData().Value }}</h2>
        @if(this.basetable() != undefined){
          <div class="timetablerow">

          {{ this.basetable()}} X {{ this.ranmulti()}} = {{this.ranresult()}}

          </div>

        }
          <div>
            <button type="button" class="btn-primary" (click)="genRandTable()">play</button>
          </div>
